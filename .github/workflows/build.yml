name: Auto Build IPA

on: [workflow_dispatch]

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Setup Xcode Automatic Signing
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}  # 你的普通 Apple ID
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      run: |
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
        security delete-keychain ios-build.keychain || true
        security create-keychain -p "" ios-build.keychain
        security unlock-keychain -p "" ios-build.keychain
        security set-keychain-settings -lut 3600 ios-build.keychain

        xcodebuild -project ios/Runner.xcodeproj \
          -allowProvisioningUpdates \
          -destination 'generic/platform=iOS' \
          -authenticationKeyAppleID "$APPLE_ID" \
          -authenticationKeyPassword "$APPLE_PASSWORD" \
          -authenticationKeyTeamID "" \
          DEVELOPMENT_TEAM="" \
          CODE_SIGN_STYLE="Automatic" \
          clean archive -archivePath build/Runner

        xcodebuild -exportArchive \
          -archivePath build/Runner.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist ios/exportOptions.plist

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: unsigned-ipa
        path: build/ipa/*.ipa
