name: iOS Build (Fixed)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable ~/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor -v

      - name: Fix iOS Config
        run: |
          flutter create --platforms ios .
          sed -i '' "1i \\
          platform :ios, '11.0'
          " ios/Podfile
          echo "workspace 'Runner'" >> ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 11.0;/' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.11.3 && pod setup

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        run: flutter build ipa --release --no-codesign

      - name: Upload Artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/ios/ipa/*.ipa
