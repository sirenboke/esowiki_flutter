name: Test Upload Artifact
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create a test file
        run: mkdir -p test_dir && echo "Hello, world!" > test_dir/test.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # 尝试 v4
        with:
          name: test-artifact
          path: test_dir

