name: Build iOS for Simulator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Flutter SDK Version
        id: flutter_version
        run: |
          flutter_version=$(grep "sdk: \">= " pubspec.yaml | cut -d'>=' -f2 | cut -d'<' -f1 | tr -d ' ')
          echo "FLUTTER_VERSION=$flutter_version" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS for Simulator (Debug)
        run: flutter build ios --simulator --debug

      - name: Upload App Directory (Unsigned Debug)
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned-debug
          path: build/ios/iphoneos
