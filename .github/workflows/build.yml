name: Flutter iOS Build

on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set Up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1 $HOME/flutter
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter doctor -v

      - name: Update iOS Deployment Target
        run: |
          # 更新 Podfile
          echo "platform :ios, '11.0'" > ios/Podfile
          cat ios/Podfile

          # 更新 Xcode 项目设置
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 11.0;/" ios/Runner.xcodeproj/project.pbxproj

      - name: Install Pods
        run: |
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Build IPA
        run: |
          flutter pub get
          flutter build ipa --release --no-codesign
          flutter pub get
          cd ios
          pod install
          cd ..
          flutter build ipa --release --no-codesign
